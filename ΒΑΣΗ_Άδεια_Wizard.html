<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1a1a18;--muted:#6b6b66;--accent:#a8501c;

@media (prefers-color-scheme: dark){:root{--bg:#191917;--panel:#222220;--ink:#e8e6e1;
  --muted:#96948d;--accent:#e08b4e;--accent-soft:#3a2c20;--line:#3a3935;--ok:#7cc47f;--warn:#e0a44e;--danger:#e57373;}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px 12px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:19px;font-weight:650}
header h1 span{color:var(--accent)}
header .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
main{max-width:860px;margin:0 auto;padding:22px 24px 70px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.8}
.crumbs b{color:var(--accent)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.qcard h2{margin:0 0 4px;font-size:17px}
.qcard .help{color:var(--muted);font-size:13px;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:12px 15px;margin:8px 0;cursor:pointer;font:inherit;color:var(--ink)}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .basis{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.opt.checked{border-color:var(--accent);background:var(--accent-soft)}
.btnrow{display:flex;gap:10px;margin-top:16px}
button.nav{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
button.nav.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.nav:disabled{opacity:.4;cursor:default}
/* result */
.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 26px}
.result h2{margin:0 0 2px;font-size:15px;color:var(--muted);font-weight:500}
.result .act{font-size:21px;font-weight:700;color:var(--accent);margin:2px 0 2px}
.result .cat{font-size:16px;font-weight:600;margin-bottom:12px}
.sec{margin-top:16px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 6px}
.basisrow{padding:7px 10px;border-left:3px solid var(--accent);background:var(--bg);
  border-radius:0 8px 8px 0;margin:5px 0;font-size:13.5px}
.appr{padding:6px 10px;margin:4px 0;font-size:13.5px;border-left:3px solid var(--warn);
  background:var(--bg);border-radius:0 8px 8px 0}
.note{padding:6px 10px;margin:4px 0;font-size:13px;border-left:3px solid var(--danger);
  background:var(--bg);border-radius:0 8px 8px 0}
.oknote{border-left-color:var(--ok)}
.disclaimer{font-size:11.5px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:10px}
.answers{font-size:12.5px;color:var(--muted);margin-top:14px}
.answers li{margin:2px 0}
@media print{header .sub,.btnrow,.crumbs{display:none}body{background:#fff}.result{border:none}}
</style>

    if (ps.ov && ps.ov.ste) hint += `<br><span style="color:var(--danger)">⚠ ${ps.ov.ste}</span><br><span style="color:var(--muted)">Συνέπεια: η επιλογή «οικισμός οριοθετημένος με Π.Δ. ΄85» είναι νομικά επισφαλής εδώ — αν το οικόπεδο είναι εντός του οικιστικού ιστού, εξέτασε το καθεστώς προ-1923 και ρώτησε την ΥΔΟΜ τι εφαρμόζει.</span>`;

    if (!ps.ov) hint += `<br><span style="color:var(--muted)">Δεν υπάρχει καταγεγραμμένο καθεστώς ορίων στη ΒΑΣΗ για τον οικισμό — απάντησε από το τοπογραφικό/ΦΕΚ του έργου. Πες στο Claude το καθεστώς όταν το μάθεις, για να αποθηκευτεί.</span>`;
    html += `<div style="padding:9px 12px;margin:0 0 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;font-size:13px">${hint}</div>`;
  }
  if (node.locpick){
    html += `<input type="text" id="setsearch" placeholder="🔍 Οικισμός ή δήμος (πανελλαδικά, ΕΛΣΤΑΤ 2021)" style="width:100%;margin:0 0 10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)" oninput="checkParadosiakos(this.value)" onfocus="checkParadosiakos(this.value)" autofocus><div id="setresult" style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px"></div>`;
    html += `<div class="btnrow"><button class="nav" onclick="goBack()" ${path.length?"":"disabled"}>← Πίσω</button>
             <button class="nav" onclick="skipLoc()">Συνέχεια χωρίς επιλογή οικισμού →</button></div>`;
    stage.innerHTML = html + "</div>";
    const sb = document.getElementById("setsearch"); if (sb) sb.focus();
    return;
  }
  if (node.multi){
    const ps = window._pickedSettlement;
    if (ps){
      if (ps.ov && ps.ov.ste)
        html += `<div style="padding:8px 12px;margin:0 0 10px;border-left:3px solid var(--danger);background:var(--bg);border-radius:0 8px 8px 0;font-size:13px">⚠ <b>${ps.o}</b>: ${ps.ov.ste}</div>`;
      html += ps.t
        ? `<div style="padding:8px 12px;margin:0 0 10px;border-left:3px solid var(--warn);background:var(--bg);border-radius:0 8px 8px 0;font-size:13px">📍 <b>${ps.o}</b>: ${ps.tu?"πιθανός ":""}χαρακτηρισμένος παραδοσιακός (${ps.t})${ps.tu?" — συνωνυμία, επιβεβαίωσε στο ΦΕΚ":""} — προ-τσεκαρίστηκε.</div>`
        : `<div style="padding:8px 12px;margin:0 0 10px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0;font-size:13px">📍 <b>${ps.o}</b>: δεν προκύπτει χαρακτηρισμός παραδοσιακού από τη βάση (κάλυψη: Π.Ε. Ρεθύμνου — ΦΕΚ 36Δ/76, 594Δ/78, 728Δ/95, 1060Δ/05). Η λίστα δεν είναι κατ' ανάγκην εξαντλητική: αν έχεις αντίθετη ένδειξη, τσέκαρέ το χειροκίνητα. Αν όχι, πάτα Συνέχεια.</div>`;
    }
    for (const [i,o] of node.options.entries())
      html += `<button class="opt ${multiSel.has(i)?'checked':''}" onclick="toggleMulti(${i})">${esc(o.label)}${o.basis?`<span class="basis">${esc(o.basis)}</span>`:""}</button>`;
    html += `<div class="btnrow"><button class="nav" onclick="goBack()" ${path.length?"":"disabled"}>← Πίσω</button>
             <button class="nav primary" onclick="confirmMulti()">Συνέχεια →</button></div>`;
  } else {
    for (const [i,o] of node.options.entries())
      html += `<button class="opt" onclick="choose(${i})">${esc(o.label)}${o.basis?`<span class="basis">${esc(o.basis)}</span>`:""}</button>`;
    html += `<div class="btnrow"><button class="nav" onclick="goBack()" ${path.length?"":"disabled"}>← Πίσω</button>
             <button class="nav" onclick="restart()">↺ Από την αρχή</button></div>`;
  }
  stage.innerHTML = html + "</div>";
}

function choose(i){
  const node = TREE.nodes[current];
  const o = node.options[i];
  path.push({nodeId: current, answerLabels:[o.label], set: o.set||null, flags: o.set&&o.set.flags||[]});
  if (o.next === "RESULT" || (o.set && !o.next)) return showResult();
  current = o.next; multiSel = new Set(); render();
}
function toggleMulti(i){
  const node = TREE.nodes[current];
  const o = node.options[i];
  if (o.exclusive){ multiSel.clear(); multiSel.add(i); }
  else { multiSel.delete(node.options.findIndex(x=>x.exclusive)); if(multiSel.has(i)) multiSel.delete(i); else multiSel.add(i);
         const ex = node.options.findIndex(x=>x.exclusive); multiSel.delete(ex); }
  render();
}
function confirmMulti(){
  const node = TREE.nodes[current];
  const chosen = [...multiSel].map(i => node.options[i]);
  if (!chosen.length){
    path.push({nodeId: current, answerLabels: ["Κανένα ειδικό καθεστώς"], set: null, flags: []});
    if (node.next && node.next !== "RESULT"){ current = node.next; multiSel = new Set(); render(); } else showResult();
    return;
  }
  path.push({nodeId: current, answerLabels: chosen.map(o=>o.label), set:null,
             flags: chosen.map(o=>o.flag).filter(f=>f&&f!=="none")});
  if (node.next && node.next !== "RESULT"){ current = node.next; multiSel = new Set(); render(); }
  else showResult();
}
function goBack(){
  if (!path.length) return;
  const last = path.pop();
  current = last.nodeId; multiSel = new Set(); render();
}
function restart(){ path=[]; current=TREE.start; multiSel=new Set(); window._pickedSettlement=null; render(); }

function showResult(){
  // συγκέντρωση
  let set = {}, flags = [];
  for (const p of path){ if (p.set) set = {...set, ...p.set}; flags.push(...(p.flags||[])); }
  flags = [...new Set(flags)];
  const basis = [], approvals = [], notes = [];
  let act = set.act || "ΟΑ", cat = set.cat || null, validity = set.validity || null;
  if (set.catBasis) basis.push(set.catBasis);
  if (set.note) notes.push(set.note);

  // Ειδικά καθεστώτα
  const cat1flags = flags.filter(f => CAT1[f]);
  if (act === "ΟΑ" && cat1flags.length){
    if (cat !== "1"){ cat = "1"; basis.push("Αναβάθμιση σε Κατηγορία 1 λόγω ειδικού καθεστώτος: " + cat1flags.map(f=>CAT1[f]).join(" · ")); }
    else basis.push(...cat1flags.map(f=>"ΚΧΠ "+CAT1[f]));
  }
  if (act === "ΕΕΔΜΚ" && cat1flags.length)
    notes.push("Σε προστατευόμενα καθεστώτα η ΕΕΔΜΚ προϋποθέτει τις ειδικές εγκρίσεις (Σ.Α./ΥΠΠΟ κ.λπ.) και ενδέχεται να αποκλείεται από την ΥΑ ΥΠΕΝ/ΔΑΟΚΑ/43266/1174/2020 (άρθρο 1 — απαγορευτικές περιπτώσεις). Έλεγξε την ΥΑ πριν την υποβολή.");
  if (act === "FREE" && cat1flags.length)
    notes.push("ΠΡΟΣΟΧΗ (ΚΧΠ 316 §1–2): οι «ελεύθερες» εργασίες τελούν υπό την επιφύλαξη ειδικών διατάξεων περιοχής/κτιρίου και αποκλείονται σε δάσος, ρέμα, αιγιαλό, αρχαιολογικό χώρο απολύτου προστασίας, επικίνδυνα κτίρια κ.λπ. Σε παραδοσιακό/διατηρητέο τεκμαίρεται ανάγκη έγκρισης — επιβεβαίωσε πριν από κάθε εργασία.");
  for (const f of flags) if (APPROVALS[f]) approvals.push(APPROVALS[f]);
  if (flags.includes("pre1955check") )
    approvals.push("Αν το κτίσμα προϋφίσταται του 1955: υποχρεωτική γνωμοδότηση Σ.Α. (ΚΧΠ 315 §4 τελ. εδάφιο)");
  if (flags.includes("aekk"))
    approvals.push("Στοιχεία Διαχείρισης Αποβλήτων (Σ.Δ.Α.) + σύμβαση με εγκεκριμένο Σ.Ε.Δ. Α.Ε.Κ.Κ. (ΚΧΠ 315 §4)");

  // Προέγκριση
  let proegrisi = null;
  if (act === "ΟΑ"){
    proegrisi = "Προαιρετική (ΚΧΠ 321 §1). Υποχρεωτική μόνο αν: δόμηση >3.000 τ.μ. (νέα ή προκύπτουσα με προσθήκη), έκδοση από άλλη υπηρεσία πλην ΥΔΟΜ, ή έργα ιδιαίτερης σημασίας/αρμοδιότητας ΔΑΟΚΑ (321 §2–3).";
  }
  if (!validity && ACTS[act]) validity = ACTS[act].v;

  const ps = window._pickedSettlement;
  const locLine = ps ? `<div style="font-size:13px;color:var(--muted);margin-bottom:8px">📍 ${ps.o} · Δήμος ${ps.d} · Π.Ε. ${ps.pe}${ps.p!=null?` · ${ps.p} κάτοικοι`:""}${ps.t?` · <span style="color:var(--warn)">${ps.tu?"πιθανός ":""}παραδοσιακός (${ps.t})</span>`:""}</div>` : "";
  let html = `<div class="result">
    <h2>Αποτέλεσμα</h2>` + locLine + `
    <div class="act">${esc(ACTS[act].name)}</div>`;
  if (act === "ΟΑ" && cat) html += `<div class="cat">Κατηγορία τρόπου έκδοσης: <b>${esc(cat)}</b> (ΚΧΠ 322)</div>`;
  html += `<div class="sec"><h3>Νομική βάση</h3>${basis.map(b=>`<div class="basisrow">${esc(b)}</div>`).join("")}
    <div class="basisrow">Γενική βάση: Ν.5306/2026 (ΦΕΚ Α΄ 88/8.6.2026) — από 8.6.2026 οι πρώην διατάξεις (Ν.4495/2017 κ.λπ.) δεν ισχύουν αυτοτελώς (ΚΧΠ 477)</div></div>`;
  if (proegrisi) html += `<div class="sec"><h3>Προέγκριση</h3><div class="basisrow">${esc(proegrisi)}</div></div>`;
  if (validity && validity !== "—") html += `<div class="sec"><h3>Ισχύς</h3><div class="basisrow">${esc(validity)}</div></div>`;
  if (approvals.length) html += `<div class="sec"><h3>Πρόσθετες εγκρίσεις / προϋποθέσεις</h3>${approvals.map(a=>`<div class="appr">${esc(a)}</div>`).join("")}</div>`;
  if (ps && ps.ov){
    let loc = "";
    if (ps.ov.ste) loc += `<div class="note">⚠ ${esc(ps.ov.ste)}</div>`;
    if (ps.ov.note) loc += `<div class="appr">${esc(ps.ov.note)}</div>`;
    if (ps.ov.appr) for (const a of ps.ov.appr)
      loc += `<div class="appr">${esc(a.f)}: <b>${esc(a.s)}</b> <span style="color:var(--muted)">— πηγή: ${esc(a.src)}</span></div>`;
    html += `<div class="sec"><h3>Τοπικό προφίλ θέσης (${esc(ps.o)})</h3>${loc}</div>`;
  }
  if (notes.length) html += `<div class="sec"><h3>Κρίσιμες παρατηρήσεις</h3>${notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</div>`;
  html += `<div class="sec"><h3>Οι απαντήσεις σου</h3><ul class="answers">${path.map(p=>`<li>${esc(p.answerLabels.join(", "))}</li>`).join("")}</ul></div>
    <div class="btnrow"><button class="nav" onclick="goBack()">← Πίσω</button>
      <button class="nav" onclick="restart()">↺ Νέος έλεγχος</button>
      <button class="nav primary" onclick="window.print()">🖨 Εκτύπωση / PDF</button></div>
    <div class="disclaimer">Εργαλείο υποβοήθησης βάσει του κειμένου του Ν.5306/2026 (corpus ΒΑΣΗ, index 2026-07-04). Δεν υποκαθιστά τον έλεγχο της ΥΔΟΜ, το e-Άδειες, ούτε ειδικότερες διατάξεις (τοπικά διατάγματα, χρήσεις γης ΚΧΠ 284–304, δασικά, ΓΠΣ/ΤΠΣ). Σε αμφιβολία: πλήρης έλεγχος με το ΒΑΣΗ Engine ή ερώτημα στην ΥΔΟΜ.</div>
  </div>`;
  crumbs.innerHTML = "";
  stage.innerHTML = html;
}
function checkParadosiakos(v){
  const out = document.getElementById("setresult");
  try{
    const S = window.VASI_SETTLEMENTS;
    if (!S){
      out.innerHTML = '<span style="color:var(--danger)">⚠ Δεν φορτώθηκε η βάση οικισμών (settlements.js). Άνοιξε το wizard μέσα από τον φάκελο 90_Engine/dashboard — τα δύο αρχεία πρέπει να είναι μαζί.</span>';
      return;
    }
    const q = norm(v.trim());
    if (!q){ out.innerHTML = `${S.length.toLocaleString("el")} οικισμοί ΕΛΣΤΑΤ 2021 — γράψε οικισμό ή δήμο`; return; }
    if (q.length < 2){ out.innerHTML = "γράψε τουλάχιστον 2 γράμματα…"; return; }
    const hits = [];
    for (const r of S){
      if (norm(r.o).includes(q) || norm(r.d).includes(q) || norm(r.k).includes(q) || norm(r.de).includes(q)){
        hits.push(r); if (hits.length > 300) break;
      }
    }
    // οικισμοί που ξεκινούν με το q πρώτοι, μετά παραδοσιακοί, μετά πληθυσμός
    hits.sort((a,b) => (norm(b.o).startsWith(q)?1:0)-(norm(a.o).startsWith(q)?1:0) || (b.t?1:0)-(a.t?1:0) || (b.p||0)-(a.p||0));
    if (!hits.length){ out.innerHTML = "— κανένα αποτέλεσμα σε οικισμό/δήμο/κοινότητα (ΕΛΣΤΑΤ 2021)"; return; }
    window._hits = hits;
    out.innerHTML = hits.slice(0,10).map((r,i) => {
      let tag = "";
      if (r.t && r.tu) tag = ` <span style="color:var(--warn)">⚠ πιθανός παραδοσιακός (${r.t}) — συνωνυμία</span>`;
      else if (r.t) tag = ` <span style="color:var(--warn)">✔ ΠΑΡΑΔΟΣΙΑΚΟΣ (${r.t})</span>`;
      const pop = r.p != null ? ` · ${r.p} κάτ.${r.p < 2000 ? " (<2.000)" : ""}` : "";
      return `<div style="padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer" onclick="pickSettlement(${i})"><b>${r.o}</b> — ${r.d}, ${r.pe}${pop}${tag}</div>`;
    }).join("") + `<div style="padding:4px 8px;font-size:11px">${hits.length>10?`+${hits.length-10} ακόμη — συνέχισε να πληκτρολογείς…`:"κλικ σε οικισμό για αυτόματη σήμανση"}</div>`;
  } catch(e){ out.innerHTML = '<span style="color:var(--danger)">Σφάλμα: ' + e.message + '</span>'; }
}
function pickSettlement(i){
  const r = window._hits[i];
  window._pickedSettlement = r;
  const pop = r.p != null ? `${r.p} κάτ.` : "χωρίς πληθυσμό";
  const tradTxt = r.t ? (r.tu ? `πιθανός παραδοσιακός ${r.t} (συνωνυμία!)` : `ΠΑΡΑΔΟΣΙΑΚΟΣ ${r.t}`) : "όχι στη λίστα παραδοσιακών";
  path.push({nodeId: "loc", answerLabels: [`${r.o} — Δ. ${r.d}, Π.Ε. ${r.pe} (${pop}, ${tradTxt})`], set: null, flags: []});
  current = "special";
  multiSel = new Set();
  const sp = TREE.nodes["special"];
  if (r.t){ const idx = sp.options.findIndex(o => o.flag === "paradosiakos"); if (idx >= 0) multiSel.add(idx); }
  render();
}
function skipLoc(){
  window._pickedSettlement = null;
  path.push({nodeId: "loc", answerLabels: ["Χωρίς επιλογή οικισμού"], set: null, flags: []});
  current = "special"; multiSel = new Set(); render();
}
render();
</script>
